name: pgqueue

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: pgqueue
      POSTGRES_PASSWORD: pgqueue
      POSTGRES_DB: pgqueue
    ports:
      # Loopback only, like the dashboard below: these are guessable development
      # credentials, and the default mapping publishes them on every interface.
      - "127.0.0.1:${PGQUEUE_POSTGRES_PORT:-5439}:5432"
    command: >-
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=20000
      -c max_connections=300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgqueue"]
      interval: 1s
      timeout: 3s
      retries: 30

  dashboard:
    image: rust:1.95-slim-bookworm
    init: true
    working_dir: /workspace
    command: scripts/dashboard
    environment:
      DATABASE_URL: postgres://pgqueue:pgqueue@postgres:5432/pgqueue
      PGQUEUE_DASHBOARD_USERNAME: admin
      PGQUEUE_DASHBOARD_PASSWORD: pgqueue-local
      PGQUEUE_DASHBOARD_SECURE_COOKIES: "false"
      RUST_LOG: pgqueue=info
    ports:
      - "127.0.0.1:${PGQUEUE_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - cargo-bin:/usr/local/cargo/bin
      - cargo-registry:/usr/local/cargo/registry
      - dashboard-target:/workspace/target
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cargo-bin:
  cargo-registry:
  dashboard-target:
